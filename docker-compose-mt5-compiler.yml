# From upstream src/docker-compose-mt5-compiler.yml (https://github.com/hudsonventura/MT5_Docker).
# Only the build context changed: upstream's `./` is `./vendor/MT5_Docker/src` here.
#
# Run:  docker compose -f docker-compose-mt5-compiler.yml up

services:

  mt5-compiler:
    image: tse-mt5:vendored
    build:
       context: ./vendor/MT5_Docker/src
       dockerfile: ./Dockerfile
    container_name: mt5-compiler

    volumes:
      - ./mql5/Experts/:/home/headless/.wine/drive_c/MQL5/Experts/      #Expose the dir with your EAs files to compile it
      - ./mql5/Include/:/home/headless/.wine/drive_c/MQL5/Include/:ro   #Expose the dir with your Include files be used to compile the EAs
    command: /build.sh
    restart: no                # does not start again

name: Compile EA (Hudsonventura build.sh)

# Compiles mql5/Experts/*.mq5 with upstream's compiler compose file and commits the .ex5,
# so the scheduled scan does not have to install MT5 twice per run.

on:
  workflow_dispatch:
  push:
    paths:
      - "mql5/Experts/**.mq5"
      - "mql5/Include/**"
      - "docker-compose-mt5-compiler.yml"
      - "vendor/MT5_Docker/src/**"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build MT5 image from vendor/MT5_Docker/src (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: ./vendor/MT5_Docker/src
          file: ./vendor/MT5_Docker/src/Dockerfile
          load: true
          tags: tse-mt5:vendored
          cache-from: type=gha,scope=tse-mt5
          cache-to: type=gha,scope=tse-mt5,mode=max

      - name: Check the EA source is in the repo
        run: |
          ls -la mql5/Experts 2>/dev/null || true
          if ! ls mql5/Experts/*.mq5 >/dev/null 2>&1; then
            echo "::error::No .mq5 file in mql5/Experts/. Upload mql5/Experts/TSE_SignalExecutor.mq5 to the repo, then re-run."
            exit 1
          fi

      - name: Compile (docker compose -f docker-compose-mt5-compiler.yml up)
        timeout-minutes: 15
        run: |
          mkdir -p compile-diag mql5/Include
          chmod -R a+rwX mql5          # container user is uid 1000
          timeout 600 docker compose -f docker-compose-mt5-compiler.yml up --pull never --exit-code-from mt5-compiler > compile-diag/compose-up.log 2>&1 || echo "compose up exit: $?"
          docker cp mt5-compiler:/tmp/wine.log compile-diag/wine.log || true
          docker cp "mt5-compiler:/home/headless/.wine/drive_c/Program Files/MetaTrader 5/MetaEditor64.exe" /dev/null 2>/dev/null && echo "MetaEditor present" || echo "MetaEditor NOT found in container"
          ls -laR mql5 > compile-diag/mql5-listing.txt
          for f in $(find mql5 -name '*.log'); do
            echo "== $f" >> compile-diag/metaeditor-logs.txt
            iconv -f UTF-16 -t UTF-8 "$f" >> compile-diag/metaeditor-logs.txt 2>/dev/null || cat "$f" >> compile-diag/metaeditor-logs.txt
          done
          echo "---- mql5 listing"; cat compile-diag/mql5-listing.txt
          echo "---- MetaEditor logs"; cat compile-diag/metaeditor-logs.txt 2>/dev/null || echo "(none written)"
          echo "---- wine.log (tail)"; tail -40 compile-diag/wine.log 2>/dev/null || true
          test -f mql5/Experts/TSE_SignalExecutor.ex5 || { echo "::error::no .ex5 produced; download the compile-diag artifact"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-diag
          path: compile-diag/

      - name: Commit .ex5
        run: |
          git config user.name "tse-bot"
          git config user.email "tse-bot@users.noreply.github.com"
          git add mql5/Experts/*.ex5
          git diff --staged --quiet || git commit -m "build: TSE_SignalExecutor.ex5"
          git pull --rebase || true
          git push

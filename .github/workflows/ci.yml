name: CI – Schema + Equivalence Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-audit:
    name: Schema + Equivalence Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . || true

      - name: Generate demonstration batch via Signal Output Interface
        run: python -m signal_interface.exporter --demo --count 8 --out example_signals/ci_batch.jsonl

      - name: Schema validation
        run: |
          python -c "
          from pathlib import Path
          from signal_interface.validator import SignalValidator
          v = SignalValidator()
          ok, records = v.validate_jsonl(Path('example_signals/ci_batch.jsonl'))
          print(v.report())
          assert ok, 'Schema validation failed'
          print(f'Validated {len(records)} signals')
          "

      - name: Permanent signal-equivalence audit
        run: pytest tests/ -v --tb=short --ignore=tests/test_http_ingress.py --json-report --json-report-file=audit_report.json

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-audit-${{ github.sha }}
          path: |
            example_signals/
            audit_report.json
            audit/
          retention-days: 30
          if-no-files-found: ignore

  docker-build:
    name: Build MT5 Receiver Image
    runs-on: ubuntu-latest
    needs: validate-and-audit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mt5-receiver
          push: false
          tags: tse-mt5-receiver:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

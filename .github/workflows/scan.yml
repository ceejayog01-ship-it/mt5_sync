name: TSE Scan → Signal Interface → Equivalence Audit

# Every 30 minutes on weekdays, 2 minutes after each M30 bar closes.
# Cheap gate decides whether anything can happen (session open).
# Liberatti is completely removed. No always-on VPS, no domain, no open ports:
# the Hudsonventura MT5 container is started inside this run, acts on the signals, and is stopped.

on:
  schedule:
    - cron: "2,32 * * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = EA logs only (default). false = EA places real orders on the MT5 account."
        required: false
        default: "true"
      force_scan:
        description: "Ignore the session filter (testing)"
        required: false
        default: "false"
      test_signal:
        description: "true = write ONE dummy EURUSD signal and run the MT5 container in DRY-RUN to test login + EA end to end (never places orders)"
        required: false
        default: "false"

concurrency:
  group: tse-scan-signal-interface
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event.inputs.test_signal == 'true' && 'true' || github.event.inputs.dry_run || vars.KB_DRY_RUN || 'true' }}
      KB_FORCE_SCAN: ${{ (github.event.inputs.force_scan == 'true' || github.event.inputs.test_signal == 'true') && 'true' || 'false' }}
      KB_STATE_DIR: state
      KB_AUDIT_DIR: audit
    steps:
      - uses: actions/checkout@v4

      - name: Gate (is anything possible right now?)
        id: gate
        run: python3 session_gate.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        if: steps.gate.outputs.active == 'true'
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Scan (51 BEST strategies → Telegram + Signal Output Interface)
        if: steps.gate.outputs.active == 'true'
        env:
          KB_PAIRS: ${{ vars.KB_PAIRS || 'XAUUSD,EURUSD,GBPUSD,USDJPY,AUDUSD' }}
          KB_EXEC_PAIRS: ${{ vars.KB_EXEC_PAIRS || 'EURUSD' }}
          KB_DESIGNS: ${{ vars.KB_DESIGNS || 'A,B' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scan_once.py

      - name: Demonstration executor + Signal Receiver (canonical path)
        if: steps.gate.outputs.active == 'true'
        run: python mt5_execute.py

      - name: TEST SIGNAL (dry-run only; replaces the signal file with one dummy row)
        if: steps.gate.outputs.active == 'true' && github.event.inputs.test_signal == 'true'
        env:
          KB_EXEC_PAIRS: ${{ vars.KB_EXEC_PAIRS || 'EURUSD' }}
        run: |
          SYM="${KB_EXEC_PAIRS%%,*}"
          mkdir -p .data/MQL5/Files
          printf 'signal_id,instrument,direction,design,entry,sl,tp,horizon_bars\nTEST-%s,%s,BUY,A,0,0,,48\n' "$(date +%s)" "$SYM" > .data/MQL5/Files/tse_signals.csv
          echo "wrote test signal for $SYM (dry-run forced):"; cat .data/MQL5/Files/tse_signals.csv

      - name: Permanent signal-equivalence audit
        if: steps.gate.outputs.active == 'true'
        run: pytest tests/ -v --tb=short

      - name: Does the MT5 terminal need to run?
        id: mt5need
        if: steps.gate.outputs.active == 'true'
        env:
          KB_EXEC_PAIRS: ${{ vars.KB_EXEC_PAIRS || 'EURUSD' }}
        run: python scripts/run_mt5_executor.py --check

      - uses: docker/setup-buildx-action@v3
        if: steps.mt5need.outputs.needed == 'true'

      - name: Build MT5 image from vendor/MT5_Docker/src (layer-cached)
        if: steps.mt5need.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./vendor/MT5_Docker/src
          file: ./vendor/MT5_Docker/src/Dockerfile
          load: true
          tags: tse-mt5:vendored
          cache-from: type=gha,scope=tse-mt5
          cache-to: type=gha,scope=tse-mt5,mode=max

      - name: Run Hudsonventura MT5 container (start, act on signals, stop)
        if: steps.mt5need.outputs.needed == 'true'
        env:
          DRY_RUN: ${{ github.event.inputs.test_signal == 'true' && 'true' || github.event.inputs.dry_run || vars.KB_DRY_RUN || 'true' }}
          KB_EXEC_PAIRS: ${{ vars.KB_EXEC_PAIRS || 'EURUSD' }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_LOTS: ${{ vars.MT5_LOTS || '0.01' }}
        run: python scripts/run_mt5_executor.py

      - name: Save state & audit artefacts
        if: steps.gate.outputs.active == 'true' && always()
        run: |
          mkdir -p state audit
          git config user.name "tse-bot"
          git config user.email "tse-bot@users.noreply.github.com"
          git add state/ audit/ || true  # state/tse_processed.txt + tse_executor_ledger.txt carry EA memory between runs
          git diff --staged --quiet || git commit -m "chore: state + audit $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git pull --rebase || true
          git push || true

      - name: Upload audit artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-audit-${{ github.sha }}
          path: |
            state/
            audit/
            signals_out.json
          retention-days: 14
          if-no-files-found: ignore

name: Extract servers.dat from Liberatti (one-time)

# The Liberatti bridge container logs in to your broker, which means its terminal knows the broker's server.
# This starts it with a broker account, waits for the login, copies its servers.dat into
# config/servers.dat and commits it. The Hudsonventura scan then mounts that file read-only.
#
# Needs three repository secrets (the broker account whose server you want to register, e.g. Headway demo):
#   REG_MT5_LOGIN, REG_MT5_PASSWORD, REG_MT5_SERVER

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Start the Liberatti bridge and wait for the broker login
        id: lib
        env:
          MT5_LOGIN: ${{ secrets.REG_MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.REG_MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.REG_MT5_SERVER }}
        run: |
          for n in MT5_LOGIN MT5_PASSWORD MT5_SERVER; do
            [ -n "${!n}" ] || { echo "::error::repository secret REG_$n is empty"; exit 1; }
          done
          API_KEY="$(openssl rand -hex 16)"
          echo "::add-mask::$API_KEY"
          docker run -d --name mt5bridge -p 127.0.0.1:5000:5000 \
            -e MT5_LOGIN -e MT5_PASSWORD -e MT5_SERVER -e API_KEY="$API_KEY" \
            -e MT5_STARTUP_TIMEOUT=180 liberatti/mt5bridge:latest >/dev/null
          ok=false
          for i in $(seq 1 100); do
            sleep 12
            code=$(curl -s -m 10 -o /tmp/ai.json -w '%{http_code}' -H "x-api-key: $API_KEY" http://127.0.0.1:5000/api/account_info || true)
            login=$(python3 -c "import json;d=json.load(open('/tmp/ai.json'));print(bool(d.get('login')), d.get('trade_mode'))" 2>/dev/null || echo "n/a")
            echo "[$((i*12))s] account_info HTTP $code, logged in / trade_mode: $login"
            if [ "${login%% *}" = "True" ]; then ok=true; break; fi
          done
          echo "logged_in=$ok" >> "$GITHUB_OUTPUT"
          $ok || { echo "::error::the bridge never logged in; see the next step's container log"; }

      - name: Copy servers.dat out of the container
        if: always()
        run: |
          mkdir -p audit config
          docker logs mt5bridge > audit/liberatti_container.log 2>&1 || true
          docker exec mt5bridge find / -iname 'servers.dat' -not -path '/proc/*' 2>/dev/null | tee audit/servers_found.txt || true
          if [ "${{ steps.lib.outputs.logged_in }}" = "true" ]; then
            sleep 45   # let the terminal write its refreshed list
            SRC="$(grep -i 'MetaTrader 5/config/servers.dat' audit/servers_found.txt | head -1)"
            [ -n "$SRC" ] || SRC="$(head -1 audit/servers_found.txt)"
            echo "copying: $SRC"
            docker cp "mt5bridge:$SRC" audit/servers.dat
            ls -la audit/servers.dat
            cp audit/servers.dat config/servers.dat
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liberatti-servers
          path: audit/

      - name: Commit config/servers.dat
        if: steps.lib.outputs.logged_in == 'true'
        run: |
          git config user.name "tse-bot"
          git config user.email "tse-bot@users.noreply.github.com"
          git add -f config/servers.dat
          git diff --staged --quiet && { echo "servers.dat unchanged"; exit 0; }
          git commit -m "config: servers.dat from a logged-in Liberatti terminal"
          git pull --rebase || true
          git push

      - name: Stop the bridge
        if: always()
        run: docker rm -f mt5bridge || true
